<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생생활 | 숭이고등학교</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="student-gallery.css">
</head>

<body>

    <!-- 학교 헤더 -->
    <header class="school-header">
        <div class="header-inner">
            <a class="school-logo" href="index.html">
                <img class="school-logo-img" src="image/logo.png" alt="숭이고등학교 로고">
                <div class="school-name">
                    <h1>숭이고등학교</h1>
                    <p>SOONG HIGH SCHOOL</p>
                </div>
            </a>

            <div class="header-right">
                <div class="top-links">
                    <a href="index.html">HOME</a>
                    <span>|</span>
                    <a href="news.html">학교소식</a>
                    <span>|</span>
                    <a href="graduation.html">졸업식 안내</a>
                </div>
            </div>
        </div>
    </header>

    <!-- 메뉴바 -->
    <nav class="main-nav">
        <div class="nav-inner">
            <a href="intro.html">학교소개</a>
            <a href="news.html">학교소식</a>
            <a href="student.html">학생생활</a>
            <a href="graduation.html">졸업식 안내</a>
            <a href="board.html">열린광장</a>
        </div>
    </nav>

    <main>
        <div class="student-gallery-page">

            <div class="student-location" id="student-location">
                HOME &gt; 학생생활 &gt; 학급별 앨범
            </div>

            <h2 class="student-heading" id="student-heading">
                학생생활
            </h2>

            <p class="student-subtitle" id="student-subtitle">
                숭이고등학교 3학년의 추억을 만나보세요.
            </p>

            <!-- 학급 선택 화면 -->
            <div id="class-selection">
                <h3 class="class-section-title">
                    3학년 학급별 앨범
                </h3>


                <div class="class-grid">

                    <!-- 3학년 1반: 클릭 불가 -->
                    <div class="class-card class-card-disabled">
                        <span class="class-card-number">01</span>
                        <strong>3학년 1반</strong>
                        <span>앨범 준비 중</span>
                    </div>

                    <!-- 3학년 2반: 클릭 가능 -->
                    <a href="student.html?class=2" class="class-card">
                        <span class="class-card-number">02</span>
                        <strong>3학년 2반</strong>
                        <span>우리 반 앨범 보기 →</span>
                    </a>

                    <!-- 3학년 3반: 클릭 불가 -->
                    <div class="class-card class-card-disabled">
                        <span class="class-card-number">03</span>
                        <strong>3학년 3반</strong>
                        <span>앨범 준비 중</span>
                    </div>

                </div>

            </div>

            <!-- 선택한 학급의 앨범 -->
            <div id="class-album" hidden>
                <div class="class-album-heading">
                    <h3 id="class-album-title"></h3>
                    <a href="student.html" class="class-back-link">
                        ← 학급 선택
                    </a>
                </div>

                <div class="student-gallery-grid" id="student-gallery"></div>

                <p class="class-empty" id="class-empty" hidden>
                    등록된 앨범이 없습니다.
                </p>
            </div>

        </div>
    </main>

    <footer>
        <p>SOONG HIGH SCHOOL</p>
        <p>비공식 팬 제작 생일 이벤트 사이트입니다.</p>
    </footer>

    <script src="student-posts.js"></script>

    <script>
        // 기존 게시글을 학급별로 분류
        // 왼쪽은 게시글 ID, 오른쪽은 반 번호
        const postClasses = {
            "01": 1,
            "02": 1,
            "03": 1,
            "04": 2,
            "05": 2,
            "06": 2,
            "07": 3,
            "08": 3
        };

        const params = new URLSearchParams(window.location.search);
        const selectedClass = params.get("class");

        const selection = document.getElementById("class-selection");
        const album = document.getElementById("class-album");
        const grid = document.getElementById("student-gallery");
        const heading = document.getElementById("student-heading");
        const subtitle = document.getElementById("student-subtitle");
        const locationText = document.getElementById("student-location");

        if (["1", "2", "3"].includes(selectedClass)) {

            selection.hidden = true;
            album.hidden = false;

            const className = "3학년 " + selectedClass + "반";

            heading.textContent = className;
            subtitle.textContent = className + "의 소중한 추억을 모았습니다.";
            locationText.textContent =
                "HOME > 학생생활 > 학급별 앨범 > " + className;

            document.getElementById("class-album-title").textContent =
                className + " 포토갤러리";

            const posts = (window.STUDENT_POSTS || []).filter(post =>
                postClasses[post.id] === Number(selectedClass)
            );

            for (const post of posts) {
                const card = document.createElement("a");
                card.className = "student-gallery-card";

                card.href =
                    "student-post.html?id=" +
                    encodeURIComponent(post.id) +
                    "&class=" + selectedClass;

                const image = document.createElement("img");
                image.className = "student-gallery-thumb";
                image.src = post.images[0];
                image.alt = post.title;
                image.loading = "lazy";

                // 사진 파일이 아직 없을 때 배경색 유지
                image.onerror = () => {
                    image.style.visibility = "hidden";
                };

                const body = document.createElement("div");
                body.className = "student-gallery-card-body";

                const title = document.createElement("span");
                title.className = "student-gallery-card-title";
                title.textContent = post.title;

                const date = document.createElement("time");
                date.className = "student-gallery-card-date";
                date.textContent = post.date;

                body.append(title, date);
                card.append(image, body);
                grid.append(card);
            }

            if (posts.length === 0) {
                document.getElementById("class-empty").hidden = false;
            }
        }
    </script>

</body>

</html>
